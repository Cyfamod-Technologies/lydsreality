name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Laravel Tests

    # Your own server
    runs-on: self-hosted

    timeout-minutes: 20

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      COMPOSER_NO_INTERACTION: 1

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Check server permissions
      # --------------------------------------------------
      - name: Check runner environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner user:"
          whoami

          echo "Operating system:"
          cat /etc/os-release

          echo "Architecture:"
          uname -m

          echo "Checking sudo access..."

          if ! sudo -n true; then
            echo "ERROR: GitHub Actions runner does not have passwordless sudo."
            exit 1
          fi

          echo "Passwordless sudo OK"

      # --------------------------------------------------
      # Install system packages
      # --------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            curl \
            git \
            unzip \
            zip \
            sqlite3 \
            software-properties-common \
            gnupg \
            libsqlite3-dev \
            libzip-dev \
            libpng-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libxml2-dev

      # --------------------------------------------------
      # Install PHP 8.3
      # --------------------------------------------------
      - name: Install PHP 8.3
        shell: bash
        run: |
          set -euo pipefail

          # Check whether PHP 8.3 is available already
          if ! apt-cache show php8.3-cli >/dev/null 2>&1; then
            echo "PHP 8.3 not available in current repositories."
            echo "Adding Ondrej PHP repository..."

            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update
          fi

          sudo apt-get install -y \
            php8.3 \
            php8.3-cli \
            php8.3-common \
            php8.3-curl \
            php8.3-gd \
            php8.3-mbstring \
            php8.3-xml \
            php8.3-zip \
            php8.3-sqlite3 \
            php8.3-bcmath \
            php8.3-intl \
            php8.3-opcache

          sudo update-alternatives --set php /usr/bin/php8.3

          php -v

      # --------------------------------------------------
      # Verify PHP extensions
      # --------------------------------------------------
      - name: Verify PHP
        shell: bash
        run: |
          set -euo pipefail

          php -r '
            if (
                version_compare(PHP_VERSION, "8.2.0", "<") ||
                version_compare(PHP_VERSION, "9.0.0", ">=")
            ) {
                fwrite(
                    STDERR,
                    "Invalid PHP version: " . PHP_VERSION . PHP_EOL
                );

                exit(1);
            }

            $extensions = [
                "bcmath",
                "curl",
                "dom",
                "fileinfo",
                "gd",
                "intl",
                "mbstring",
                "openssl",
                "pdo",
                "pdo_sqlite",
                "xml",
                "zip"
            ];

            foreach ($extensions as $extension) {
                if (! extension_loaded($extension)) {
                    fwrite(
                        STDERR,
                        "Missing PHP extension: {$extension}" . PHP_EOL
                    );

                    exit(1);
                }
            }

            echo "PHP " . PHP_VERSION . " is ready." . PHP_EOL;
          '

          php -m

      # --------------------------------------------------
      # Install Composer
      # --------------------------------------------------
      - name: Install Composer
        shell: bash
        run: |
          set -euo pipefail

          if command -v composer >/dev/null 2>&1; then
            echo "Composer already installed"
            composer --version
            exit 0
          fi

          EXPECTED_CHECKSUM="$(curl -s https://composer.github.io/installer.sig)"

          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"

          ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"

          if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
            echo "ERROR: Invalid Composer installer checksum"
            rm composer-setup.php
            exit 1
          fi

          sudo php composer-setup.php \
            --install-dir=/usr/local/bin \
            --filename=composer

          rm composer-setup.php

          composer --version

      # --------------------------------------------------
      # Composer cache
      # --------------------------------------------------
      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php83-composer-

      # --------------------------------------------------
      # Composer dependencies
      # --------------------------------------------------
      - name: Install Composer dependencies
        shell: bash
        run: |
          set -euo pipefail

          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

      # --------------------------------------------------
      # Laravel setup
      # --------------------------------------------------
      - name: Prepare Laravel
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          mkdir -p database
          touch database/database.sqlite

          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

          chmod -R ug+rwX storage
          chmod -R ug+rwX bootstrap/cache

          php artisan key:generate

      # --------------------------------------------------
      # Clear Laravel cache
      # --------------------------------------------------
      - name: Clear Laravel caches
        shell: bash
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      # --------------------------------------------------
      # Database
      # --------------------------------------------------
      - name: Run database migrations
        shell: bash
        run: |
          php artisan migrate --force

      # --------------------------------------------------
      # Tests
      # --------------------------------------------------
      - name: Run Laravel tests
        shell: bash
        run: |
          php artisan test