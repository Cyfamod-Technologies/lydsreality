name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Laravel Tests In Docker
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image and run Laravel tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.ci
          push: false
          tags: lydsreality-ci:${{ github.sha }}
          cache-from: type=gha,scope=lydsreality-ci
          cache-to: type=gha,mode=max,scope=lydsreality-ci
