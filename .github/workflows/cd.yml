name: Build, Publish, And Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: lydsreality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
  DOKPLOY_COMPOSE_NAME: ${{ vars.DOKPLOY_COMPOSE_NAME || 'lydsreality' }}
  SERVER_ENV_FILE: ${{ vars.SERVER_ENV_FILE }}
  SSH_PORT: ${{ vars.SSH_PORT || '22' }}
  DOKPLOY_URL: http://127.0.0.1:5000
  COMPOSE_FILE: docker-compose.dokploy.yml
  HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}

jobs:
  ci:
    name: Test Application
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish To GHCR And Deploy With Dokploy
    needs: ci
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: bash .github/scripts/validate-deployment.sh

      - name: Prepare deployment files and image metadata
        run: bash .github/scripts/prepare-deployment.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_REPOSITORY }}:dev
          labels: |
            org.opencontainers.image.title=lydsreality
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash .github/scripts/configure-ssh.sh

      - name: Pull the prebuilt GHCR image on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: bash .github/scripts/pull-ghcr-image.sh

      - name: Deploy the Dokploy Compose project
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: bash .github/scripts/deploy-dokploy.sh

      - name: Verify public health endpoint
        if: env.HEALTHCHECK_URL != ''
        run: bash .github/scripts/healthcheck.sh

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## LydsReality deployment completed"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Build location: \`GitHub Actions\`"
            echo "- Image delivery: \`GHCR -> server docker pull\`"
            echo "- Dokploy project: \`${DOKPLOY_COMPOSE_NAME}\`"
            echo "- Dokploy Compose ID: \`${DOKPLOY_COMPOSE_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
